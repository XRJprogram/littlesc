<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="114" height="178" viewBox="0,0,114,178"><g transform="translate(-263,-86)"><g stroke="none" stroke-miterlimit="10"><image x="526" y="172" transform="scale(0.5,0.5)" width="228" height="356" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><g fill="#644b05"><text transform="translate(274.30001,138.38623) scale(0.17594,0.17594)" font-size="40" xml:space="preserve" fill="#644b05" stroke-width="1" font-family="&quot;BOUTIQUEBITMAP9X9_1&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">     作为先灵的异能者，因「</tspan><tspan x="0" dy="48px">异能者大战」中落败而被进行</tspan><tspan x="0" dy="48px">「灵魂囚禁」。受「点灯人」</tspan><tspan x="0" dy="48px">指引，于幻想城毁灭的世界线</tspan><tspan x="0" dy="48px">中帮助幻想城的创造者重新寻</tspan><tspan x="0" dy="48px">回关于这座城市的一切信息，</tspan><tspan x="0" dy="48px">重塑本格于本初世界中溶洞的</tspan><tspan x="0" dy="48px">先灵樱花树下。</tspan><tspan x="0" dy="48px">     因永恒之日的到来，被命</tspan><tspan x="0" dy="48px">令指引迷失者的本格，发掘永</tspan><tspan x="0" dy="48px">恒之日的真相，解救幻想城。</tspan></text><path d="M274.33263,148.32399v-6.47113h35.461v6.47113z" stroke-width="0"/><path d="M274.33263,198.99114v-6.47113h34.68824v6.47113z" stroke-width="0"/><path d="M280.46318,156.79857v-6.47113h29.33045v6.47113z" stroke-width="0"/><path d="M337.02046,156.79857v-6.47113h21.87762v6.47113z" stroke-width="0"/><path d="M302.40092,165.27315v-6.47113h20.61545v6.47113z" stroke-width="0"/><path d="M344.59348,165.27315v-6.47113h20.61545v6.47113z" stroke-width="0"/><path d="M295.36881,173.56741v-6.47113h20.61546v6.47113z" stroke-width="0"/><path d="M295.36882,182.07205v-6.47113h27.64755v6.47113z" stroke-width="0"/><path d="M309.41799,190.48652v-6.47113h27.64755v6.47113z" stroke-width="0"/><path d="M295.37955,207.3584v-6.47113h27.64755v6.47113z" stroke-width="0"/><path d="M330.58939,182.07205v-6.47113h27.64756v6.47113z" stroke-width="0"/><path d="M288.21651,190.48652v-6.47113h13.67351v6.47113z" st