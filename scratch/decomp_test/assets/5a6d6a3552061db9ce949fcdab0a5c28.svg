<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="140.27136" height="197.2566" viewBox="0,0,140.27136,197.2566"><g transform="translate(-249.86432,-81.3717)"><g stroke="none" stroke-miterlimit="10"><image x="342.00816" y="111.37959" transform="scale(0.73058,0.73058)" width="192" height="270" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><image x="1026.00259" y="698.00007" transform="scale(0.33333,0.33333)" width="88" height="80" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><image x="1026.00262" y="698.00007" transform="scale(0.33333,0.33333)" width="88" height="80" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><image x="781.82059" y="683.78154" transform="scale(0.34147,0.34147)" width="72" height="72" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(289.50959,114.01204) scale(0.54391,0.54391)" font-size="40" xml:space="preserve" fill="#2a1d0d" stroke-width="1" font-family="&quot;BOUTIQUEBITMAP9X9_1&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Alpha</tspan></text><text transform="translate(266.49715,128.67703) scale(0.19515,0.19515)" font-size="40" xml:space="preserve" fill="#2a1d0d" stroke-width="1" font-family="&quot;BOUTIQUEBITMAP9X9_1&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">     作为先灵的异能者，因「</tspan><tspan x="0" dy="48px">异能者大战」中落败而被进行</tspan><tspan x="0" dy="48px">「灵魂囚禁」。受「点灯人」</tspan><tspan x="0" dy="48px">指引，于幻想城毁灭的世界线</tspan><tspan x="0" dy="48px">中帮助幻想城的创造者重新寻</tspan><tspan x="0" dy="48px">回关于这座城市的一切信息，</tspan><tspan x="0" dy="48px">重塑本格于本初世界中溶洞的</tspan><tspan x="0" dy="48px">先灵樱花树下。</tspan><tspan x="0" dy="48px">     因永恒之日的到来，被命</tspan><tspan x="0" dy="48px">令指引迷失者的本格，发掘永</tspan><tspan x="0" dy="48px">恒之日的真相，解救幻想城。</tspan></text><text transform="translate(299.15293,242.805) scale(0.22481,0.22481)" font-size="40" xml:space="preserve" fill="#2a1d0d" stroke-width="1" font-family="&quot;BOUTIQUEBITMAP9X9_1&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">无法积蓄</tspan><tspan x="0" dy="46.150000000000006px">能量胶质</tspan></text></g></g></svg>